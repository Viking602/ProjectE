plugins {
    id 'java-library'
    id 'maven-publish'
    id 'com.gradleup.shadow' version '9.3.0'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = projecte_version
group = 'moze_intel.projecte'
base.archivesName = 'ProjectE'
java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}
sourceSets {
    api { resources.srcDirs = [] }
    main {
        compileClasspath += api.output
        runtimeClasspath += api.output
        resources.srcDir 'src/datagen/generated'
        resources.exclude '.cache/**'
        // These upstream projects do not publish a matching 26.1.2 NeoForge build.
        java.exclude 'moze_intel/projecte/integration/crafttweaker/**',
                'moze_intel/projecte/integration/recipe_viewer/emi/**'
    }
    datagen {
        compileClasspath += api.output + main.output
        runtimeClasspath += api.output + main.output
    }
    test {
        compileClasspath += api.output
        runtimeClasspath += api.output
    }
    smoke {
        compileClasspath += api.output + main.output
        runtimeClasspath += api.output + main.output
    }
    packSmoke {
        // Load the packaged ProjectE JAR with the instance's installed mods.
        runtimeClasspath += smoke.output
    }
}
configurations {
    shaded
    implementation.extendsFrom shaded
    apiImplementation.extendsFrom implementation
    apiCompileOnly.extendsFrom compileOnly
    datagenImplementation.extendsFrom implementation
    datagenCompileOnly.extendsFrom compileOnly
    smokeImplementation.extendsFrom implementation
    smokeCompileOnly.extendsFrom compileOnly
}
repositories {
    if (file('../devtools/maven').isDirectory()) {
        exclusiveContent {
            forRepository { maven { url = uri('../devtools/maven') } }
            filter {
                includeGroupByRegex 'org.junit.*'
                includeGroup 'org.opentest4j'
                includeGroup 'org.apiguardian'
                includeModule 'net.neoforged', 'testframework'
            }
        }
    }
    mavenCentral()
}
dependencies {
    compileOnly files(fileTree('../../mods') { include 'jei-*.jar', 'curios-*.jar', 'Jade-*.jar' })
    compileOnly files(fileTree('../devtools/projecte-optional') { include 'theoneprobe-*.jar', 'wthit-*.jar' })
    implementation 'org.jetbrains:annotations:26.0.2-1'
    shaded 'org.apache.commons:commons-math3:3.6.1'
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation("net.neoforged:testframework:${neo_version}") { transitive = false }
    smokeRuntimeOnly files(fileTree('../../mods') { include 'jei-*.jar', 'curios-*.jar', 'Jade-*.jar' })
    smokeCompileOnly files(fileTree('../../mods') { include 'titanium-*.jar', 'industrialforegoing-*.jar' })
    smokeCompileOnly files('../Mekanism/build/libs/Mekanism-26.1.2-10.8.0-viking602.1.homebaked-projecte.1.jar')
    if (project.hasProperty('portPack')) {
        packSmokeRuntimeOnly files(tasks.shadowJar)
        packSmokeRuntimeOnly files(fileTree('../../mods') {
            if (project.hasProperty('packMinimal')) include 'jei-*.jar', 'curios-*.jar', 'Jade-*.jar'
            else include '*.jar'
            exclude 'ProjectE-*.jar'
        })
    }
}
neoForge {
    enable {
        version = neo_version
        enabledSourceSets = sourceSets
    }
    mods {
        projecte {
            sourceSet sourceSets.main
            sourceSet sourceSets.api
        }
        if (project.hasProperty('portSmoke')) {
            projecteSmoke { sourceSet sourceSets.smoke }
        }
    }
    runs {
        client {
            client()
            gameDirectory = file('../test-projecte-client')
        }
        server {
            server()
            programArgument '--nogui'
            gameDirectory = file('../test-projecte-server')
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file('../test-projecte-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'projecte'
        }
        if (project.hasProperty('portSmoke')) {
            smokeServer {
                server()
                sourceSet = sourceSets.smoke
                loadedMods = [mods.projecte, mods.projecteSmoke]
                programArgument '--nogui'
                gameDirectory = file('../test-projecte-server')
            }
            smokeClient {
                client()
                sourceSet = sourceSets.smoke
                loadedMods = [mods.projecte, mods.projecteSmoke]
                programArguments.addAll('--quickPlayMultiplayer', '127.0.0.1:25586', '--username', 'ProjectEPortTest', '--width', '1280', '--height', '800')
                gameDirectory = file('../test-projecte-client')
            }
            if (project.hasProperty('portPack')) {
                packServer {
                    server()
                    sourceSet = sourceSets.packSmoke
                    loadedMods = [mods.projecteSmoke]
                    jvmArgument '-Xmx4G'
                    jvmArgument "-Xbootclasspath/a:${file('../devtools/pack-bootstrap/kotlin-stdlib.jar').absolutePath}"
                    programArgument '--nogui'
                    gameDirectory = file('../test-projecte-pack-server')
                }
                packClient {
                    client()
                    sourceSet = sourceSets.packSmoke
                    loadedMods = [mods.projecteSmoke]
                    jvmArgument '-Xmx6G'
                    jvmArgument "-Xbootclasspath/a:${file('../devtools/pack-bootstrap/kotlin-stdlib.jar').absolutePath}"
                    if (project.hasProperty('packMinimal')) programArguments.addAll('--quickPlayMultiplayer', '127.0.0.1:25586')
                    else programArguments.addAll('--quickPlaySingleplayer', 'ProjectEPortTest')
                    programArguments.addAll('--username', 'ProjectEPortTest', '--width', '1280', '--height', '800')
                    gameDirectory = file('../test-projecte-pack-client')
                }
            }
        }
    }
    unitTest {
        enable()
        testedMod = mods.projecte
        loadedMods = [mods.projecte]
    }
}
processResources {
    def replacements = [version: projecte_version, mc_version: minecraft_version_range,
                        neo_version: neo_version_range, loader_version: loader_version_range]
    inputs.properties replacements
    filesMatching('META-INF/neoforge.mods.toml') { expand replacements }
}
jar {
    archiveClassifier = 'unshaded'
    from sourceSets.api.output
    from 'LICENSE'
}
shadowJar {
    archiveClassifier = ''
    configurations = [project.configurations.shaded]
    from sourceSets.api.output
    from 'LICENSE'
    relocate 'org.apache.commons.math3', 'moze_intel.projecte.shaded.org.apache.commons.math3'
    exclude 'META-INF/maven/**', 'META-INF/versions/**', 'module-info.class'
}
assemble.dependsOn shadowJar
sourcesJar { from sourceSets.api.allSource }
test { useJUnitPlatform() }
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll '-Xmaxerrs', '10000'
}
